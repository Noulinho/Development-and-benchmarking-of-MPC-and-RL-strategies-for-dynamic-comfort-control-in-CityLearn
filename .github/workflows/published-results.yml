name: Published results

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install locked analysis environment
        run: |
          python -m pip install -r requirements-analysis.txt
          python -m pip check
      - name: Verify published artifacts and summary calculations
        run: python scripts/verify_results.py
      - name: Test verification failures and regressions
        run: python -m unittest discover -s tests -p test_published_results.py -v
      - name: Execute reading notebooks from saved exports
        run: python scripts/build_results_notebooks.py --execute --output-dir "${{ runner.temp }}/ce1-notebooks"
      - name: Upload rebuilt notebooks
        uses: actions/upload-artifact@v4
        with:
          name: published-results-notebooks
          path: ${{ runner.temp }}/ce1-notebooks/*.ipynb
          if-no-files-found: error
